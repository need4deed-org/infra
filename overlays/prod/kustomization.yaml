apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n4d-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  # Sealed blobs ride the same diff/apply loop as everything else. They
  # need the SealedSecret CRD, which bootstrap.sh installs before the
  # first overlay apply.
  - ../../secrets/prod/n4d-prod
components:
  # Both are needed: postgres-prod patches the StatefulSet that
  # components/postgres provides. A managed-database provider branch
  # omits both instead.
  - ../../components/postgres
  - ../../components/postgres-prod

# Every image is pinned by digest. Production changes only when a digest
# below changes: edit the pin, `kubectl diff -k`, apply. Rollback is
# reverting the pin commit and applying again - but note that reverting an
# image does not revert a migration it has already run; rolling back past
# a schema change needs that change to be backward-compatible.
images:
  # be and bootstrap are built from the same repo and must agree on the
  # migration set: when a be bump includes a new migration, rebuild the
  # bootstrap image (build-bootstrap workflow in the be repo) and bump
  # both digests together.
  - name: ghcr.io/need4deed-org/be
    digest: sha256:8945d0de04dd8717053ad77bb9ee3530d5664014d7c4ba149d2c9e8980358026
  # bootstrap and fe currently point at theodore-evans/* builds: the org has
  # no usable image (bootstrap's org build predates fixes the be depends on;
  # fe has no org workflow run yet). Once the org repos run the workflows,
  # drop each newName and take the org digest.
  #
  # postgres switched to the org build on 2026-08-21 (first successful run
  # of build-postgres-image.yaml, dispatched manually). The digest below
  # previously named this same entry but carried theodore-evans/postgres's
  # digest with newName commented out — ghcr.io/need4deed-org/postgres never
  # had an image at that digest, which is what took prod's postgres down.
  - name: ghcr.io/need4deed-org/bootstrap
    #newName: ghcr.io/theodore-evans/bootstrap
    digest: sha256:6e06acb42c744e64767e6132e9eed819c2f9f3f0b49483046365081f10ce00f2

  - name: ghcr.io/need4deed-org/fe
    #newName: ghcr.io/theodore-evans/fe
    digest: sha256:e510c3f1e34eaf958f3f2557d430ce697a15ffd24df27aa8d7da45a16d104cc6

  - name: ghcr.io/need4deed-org/postgres
    digest: sha256:a2e106c14ab33b640c7a83993c193538b79bf05f37c82bbddfc58d9563cc448a

# On a fresh provision, keep be at 0 until real data is restored: with
# NODE_ENV=production the bootstrap migrates and seeds unconditionally,
# and seeding an empty database creates fixture users. Production data
# was restored 2026-08-17; 1 is the running state.
replicas:
  - name: be
    count: 1
