apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n4d-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
components:
  # Both are needed: postgres-prod patches the StatefulSet that
  # components/postgres provides. A managed-database provider branch
  # (cutover-runbook.md B1-B3) omits both instead.
  - ../../components/postgres
  - ../../components/postgres-prod
images:
  # Built from the theodore-evans/be fork (branch build-bootstrap-fork, synced
  # to upstream develop 2026-08-17 incl. be#876's add-api-key migration - the
  # be:develop image and this bootstrap must agree on the migration set)
  # because the org image is stale: its 2026-07-13 build predates
  # DB_SSL_CA_PATH (be#823) and the onetimer sequence fix (be#866).
  # Re-point to ghcr.io/need4deed-org/bootstrap once the org rebuilds it.
  - name: ghcr.io/need4deed-org/bootstrap
    newName: ghcr.io/theodore-evans/bootstrap
    digest: sha256:b8e483df55d33ae327543bf633a95378a4bc5a0e7bf185d825834001effa8f3f
  # Built by build-fe.yaml in the theodore-evans/fe fork (upstream has no fe
  # image workflow). Bakes API_URL=http://be:8000 (the fe server proxies
  # /api/* in-cluster; the browser stays same-origin) and cdn.need4deed.org
  # asset hosts. Re-point to the org namespace once upstream adopts the
  # workflow.
  - name: ghcr.io/need4deed-org/fe
    newName: ghcr.io/theodore-evans/fe
    digest: sha256:ea0f03a41ba9d7ed93e8fe17bc18d564da1fc177af93df050378ac5e4002933c
  # Built from images/postgres by build-postgres-image.yaml running in the
  # theodore-evans fork (the branch is not upstream yet, so the org namespace
  # has no image). Re-point to ghcr.io/need4deed-org/postgres and its digest
  # once the org repo runs the workflow post-merge.
  - name: ghcr.io/need4deed-org/postgres
    newName: ghcr.io/theodore-evans/postgres
    digest: sha256:daf9e5521951cdd85d63e86068fd475fe28ccc827565f29d712359768f555a0e
# be must not run against the empty database: with NODE_ENV=production the
# bootstrap init container runs migrations and seeds unconditionally
# (RUN_MIGRATIONS is only consulted outside prod), and on an empty database
# the seeder creates fixture users. Set to 1 at cutover, after the RDS dump
# is restored (seeding then skips: users exist).
replicas:
  - name: be
    count: 0
