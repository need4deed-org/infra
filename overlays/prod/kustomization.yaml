apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n4d-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
components:
  # Both are needed: postgres-prod patches the StatefulSet that
  # components/postgres provides. A managed-database provider branch
  # omits both instead.
  - ../../components/postgres
  - ../../components/postgres-prod

# Every image is pinned by digest. Production changes only when a digest
# below changes: edit the pin, `kubectl diff -k`, apply. Rollback is
# reverting the pin commit and applying again - but note that reverting an
# image does not revert a migration it has already run; rolling back past
# a schema change needs that change to be backward-compatible.
images:
  # be and bootstrap are built from the same repo and must agree on the
  # migration set: when a be bump includes a new migration, rebuild the
  # bootstrap image (build-bootstrap workflow in the be repo) and bump
  # both digests together.
  - name: ghcr.io/need4deed-org/be
    digest: sha256:17fc23897765181653f17e2391d1a0cdb3be0c6997ef1d72cec756408e2e6db5
  # bootstrap, fe and postgres currently point at theodore-evans/* builds:
  # the org has no usable image (bootstrap's org build predates fixes the
  # be depends on; fe and postgres have no org workflow runs yet). Once the
  # org repos run the workflows, drop each newName and take the org digest.
  - name: ghcr.io/need4deed-org/bootstrap
    #newName: ghcr.io/theodore-evans/bootstrap
    digest: sha256:32f72ad53b59f99a620567f53f91bdfa33392116784f1d47b838e2406b42ecac
  - name: ghcr.io/need4deed-org/fe
    #newName: ghcr.io/theodore-evans/fe
    digest: ha256:e510c3f1e34eaf958f3f2557d430ce697a15ffd24df27aa8d7da45a16d104cc6
  - name: ghcr.io/need4deed-org/postgres
    newName: ghcr.io/theodore-evans/postgres
    digest: sha256:daf9e5521951cdd85d63e86068fd475fe28ccc827565f29d712359768f555a0e

# On a fresh provision, keep be at 0 until real data is restored: with
# NODE_ENV=production the bootstrap migrates and seeds unconditionally,
# and seeding an empty database creates fixture users. Production data
# was restored 2026-08-17; 1 is the running state.
replicas:
  - name: be
    count: 1
