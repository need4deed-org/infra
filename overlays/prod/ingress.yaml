apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fe
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe
                port:
                  number: 3000
    - host: www.need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe
                port:
                  number: 3000
  tls:
    - hosts:
        - need4deed.org
        - www.need4deed.org
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: be
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    # The be registers all routes at the root, so it gets its own host
    # rather than a stripped /api path. The fe image must be built with
    # NEXT_PUBLIC_API_URL=https://api.need4deed.org and Namecheap needs
    # an A record for it at cutover.
    - host: api.need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: be
                port:
                  number: 8000
  tls:
    - hosts:
        - api.need4deed.org
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdn
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    # CDN_BASE_URL points here; the backend fetches email templates through
    # it, so the name must resolve before that path is exercised.
    - host: cdn.need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cdn-proxy
                port:
                  number: 80
  tls:
    - hosts:
        - cdn.need4deed.org
