apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: be
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: aits.need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: be
                port:
                  number: 8000
    - host: dev.need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: be
                port:
                  number: 8000
  tls:
    - hosts:
        - aits.need4deed.org
        - dev.need4deed.org
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdn
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    # CDN_BASE_URL points here; the backend fetches email templates through
    # it, so the name must resolve before that path is exercised.
    - host: cdn.need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cdn-proxy
                port:
                  number: 80
  tls:
    - hosts:
        - cdn.need4deed.org
