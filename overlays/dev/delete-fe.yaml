# fe has no Ingress route in this overlay (only `be` is exposed, at
# aits.need4deed.org / dev.need4deed.org) — it just ran unreachable, burning
# CPU/memory on an already tight node. Deletes the Deployment + Service that
# base/fe/ would otherwise contribute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: fe
$patch: delete
