apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-pg-hba
data:
  pg_hba.conf: |
    # No `host` line: a plaintext TCP connection is refused outright rather
    # than downgraded to an unencrypted session.
    # TYPE     DATABASE  USER  ADDRESS  METHOD
    local      all       all            scram-sha-256
    hostssl    all       all   all      scram-sha-256
