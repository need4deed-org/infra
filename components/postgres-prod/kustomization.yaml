apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Layered on top of components/postgres, which it patches. Both are needed:
# this one alone has no StatefulSet to patch.
resources:
  - pg-hba-configmap.yaml
  - pgbackrest-configmap.yaml
  - init-roles-configmap.yaml
  - backup-cronjob.yaml
  - network-policies.yaml
patches:
  - path: statefulset-patch.yaml
# The StatefulSet and the backup CronJob must run the same build; one entry
# keeps them in step. Pinned by digest: a silent 17.x bump under the only
# stateful component must be a reviewed change. Dev keeps stock postgres:17,
# which is why this lives here and not in components/postgres.
images:
  - name: postgres
    newName: ghcr.io/need4deed-org/postgres
    digest: sha256:a2e106c14ab33b640c7a83993c193538b79bf05f37c82bbddfc58d9563cc448a
