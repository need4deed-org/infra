apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: be
  template:
    metadata:
      labels:
        app: be
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      volumes:
        # optional: dev has no postgres-ca secret, and NODE_ENV=development
        # makes the BE connect without TLS and never read the path. Where the
        # secret is absent the subPath leaves an empty directory behind, so a
        # prod pod that lost its CA fails at import instead of falling back to
        # the public root store. subPath mounts do not track secret updates:
        # rotating the CA needs a be restart.
        - name: postgres-ca
          secret:
            secretName: postgres-ca
            optional: true
      initContainers:
        - name: bootstrap
          # Digest, not a tag: this image runs next to database credentials and
          # is rebuilt from a non-prod branch. Overlays override via `images:`.
          image: ghcr.io/need4deed-org/bootstrap@sha256:94286299edbe6ba65be0a046c72cc4995b21e5cccd0b9c5548c5895077e9ec89
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: bootstrap-secret
          # A path, not a secret: the BE otherwise defaults to the AWS RDS
          # bundle still baked into the image, which cannot verify this server.
          env:
            - name: DB_SSL_CA_PATH
              value: /app/certificates/postgres-ca.crt
          # The init container imports the same data-source.ts and its image
          # copies no ca/ directory: without this mount the pod never leaves
          # init under NODE_ENV=production.
          volumeMounts:
            - name: postgres-ca
              mountPath: /app/certificates/postgres-ca.crt
              subPath: ca.crt
              readOnly: true
      containers:
        - name: be
          image: ghcr.io/need4deed-org/be:develop
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: be-secret
          env:
            - name: DB_SSL_CA_PATH
              value: /app/certificates/postgres-ca.crt
          volumeMounts:
            - name: postgres-ca
              mountPath: /app/certificates/postgres-ca.crt
              subPath: ca.crt
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health-check
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health-check
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
