apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdn-proxy
  template:
    metadata:
      labels:
        app: cdn-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: config
              mountPath: /etc/nginx/cdn-origin.conf
              subPath: cdn-origin.conf
              readOnly: true
            - name: cache
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: cdn-proxy-config
        - name: cache
          emptyDir:
            sizeLimit: 3Gi
