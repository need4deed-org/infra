# TEMPORARY - cutover-eve ACME pre-test (2026-08-17). Proves the
# Traefik -> Let's Encrypt issuance path on a throwaway hostname
# (vps.need4deed.org, A record added for the test) before the real
# app/cdn hosts need certificates on cutover day.
#
# Apply with kubectl (not part of any overlay); delete the Ingress and
# this file, and remove the DNS record, once the certificate is observed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-pretest
  namespace: n4d-prod
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: vps.need4deed.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe
                port:
                  number: 3000
  tls:
    - hosts:
        - vps.need4deed.org
