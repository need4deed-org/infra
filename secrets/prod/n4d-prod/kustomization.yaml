apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every sealed blob for the prod namespace. overlays/prod includes this
# directory, so secrets deploy through the same diff/apply loop as
# everything else; a committed rotation shows up in `kubectl diff -k
# overlays/prod` instead of waiting on a separate apply step.
resources:
  - be-secret.yaml
  - bootstrap-secret.yaml
  - fe-secret.yaml
  - ghcr-secret.yaml
  - pg-backup-alerts.yaml
  - pgbackrest-secret.yaml
  - postgres-ca.yaml
  - postgres-secret.yaml
  - postgres-tls.yaml
