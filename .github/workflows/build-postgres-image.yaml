name: build-postgres-image

on:
  push:
    branches: [main]
    paths:
      - images/postgres/**
      - .github/workflows/build-postgres-image.yaml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/need4deed-org/postgres:17
            ghcr.io/need4deed-org/postgres:17-pgbackrest-2.59.0

      # The StatefulSet pins this digest. Copy it into
      # components/postgres/statefulset.yaml after the first publish.
      - run: echo "digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
